name: Bounded phase observer Linux diagnostic

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Required by the fork workflow schema; ignored for checkout and build selection
        required: true
        type: string

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          CANDIDATE_SHA: 2e59d195b2a388093c5fe4205d8f52abb09771fc
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT)) {
              throw new Error('The required workflow-schema PR input must be a positive integer; it does not select a PR');
            }
            const { owner, repo } = context.repo;
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Only collaborators with write access can start or rerun builds');
              }
            }
            const { data: candidate } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.CANDIDATE_SHA });
            if (candidate.sha !== process.env.CANDIDATE_SHA) {
              throw new Error('Pinned candidate commit is unavailable or does not match');
            }
            core.setOutput('sha', candidate.sha);
            core.info('The required PR workflow input is schema-only; no pull request is queried or merged.');
            await core.summary.addRaw(`Bounded diagnostic for exact candidate ${candidate.sha}; PR input is schema-only.`).write();

  linux:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-phase-r4-2e59
          save: false
          evict-old-files: job
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure exact head
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Check test registration
        run: python3 tools/check_test_registration.py build
      - name: Build only observer and fixture targets
        run: cmake --build build --parallel 2 --target guest_phase_observer_tests guest_event_flag_phase_tests agc_recompile_phase_observer_tests
      - name: Run selected phase cases, including POSIX cancel coverage
        run: ctest --test-dir build --output-on-failure --timeout 120 --repeat until-fail:3 --parallel 1 --output-log "$GITHUB_WORKSPACE/build/ctest.log" --output-junit "$GITHUB_WORKSPACE/build/ctest.xml" -R '^(guest_phase_observer_(off|zero|on)|guest_event_flag_phase_(off|zero|on|invalid|posix_cancel)|agc_recompile_phase_observer_(off|zero|on))$'
      - name: Require the exact selected cases to pass
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -f build/ctest.xml ]; then
            echo "::error::CTest did not produce build/ctest.xml; exact case accounting is unavailable"
            exit 1
          fi
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "guest_phase_observer_off",
              "guest_phase_observer_zero",
              "guest_phase_observer_on",
              "guest_event_flag_phase_off",
              "guest_event_flag_phase_zero",
              "guest_event_flag_phase_on",
              "guest_event_flag_phase_invalid",
              "guest_event_flag_phase_posix_cancel",
              "agc_recompile_phase_observer_off",
              "agc_recompile_phase_observer_zero",
              "agc_recompile_phase_observer_on",
          }
          cases = list(ET.parse("build/ctest.xml").getroot().iter("testcase"))
          names = [case.get("name", "") for case in cases]
          missing = sorted(expected - set(names))
          extra = sorted(set(names) - expected)
          duplicates = sorted(name for name in set(names) if names.count(name) != 1)
          failed = sorted(case.get("name", "<unnamed>") for case in cases
                          if case.get("status", "run") != "run"
                          or any(case.find(tag) is not None for tag in ("failure", "error", "skipped")))
          for label, values in (("missing", missing), ("extra", extra), ("duplicate", duplicates), ("failed-or-skipped", failed)):
              if values:
                  print(f"{label}: {', '.join(values)}", file=sys.stderr)
          if missing or extra or duplicates or failed or len(cases) != 11:
              print(f"expected 11 unique passing cases; received {len(cases)} testcase records", file=sys.stderr)
              raise SystemExit(1)
          print("All 11 selected Linux phase cases appeared exactly once and passed without skips.")
          PY
      - name: Check selected-test skip accounting
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -f build/ctest.xml ]; then
            echo "::error::CTest did not produce build/ctest.xml; skip accounting is unavailable"
            exit 1
          fi
          python3 tools/check_skips.py build/ctest.xml
      - name: Preserve selected-test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-observer-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ctest.xml
            build/ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
