name: Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Required by the fork workflow schema; ignored for checkout and build selection
        required: true
        type: string

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          CANDIDATE_SHA: 47b3f610c31d6d4862bd0553465118beb256e81a
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT)) {
              throw new Error('The required workflow-schema PR input must be a positive integer; it does not select a PR');
            }
            const { owner, repo } = context.repo;
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Only collaborators with write access can start or rerun builds');
              }
            }
            const { data: candidate } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.CANDIDATE_SHA });
            if (candidate.sha !== process.env.CANDIDATE_SHA) {
              throw new Error('Pinned candidate commit is unavailable or does not match');
            }
            core.setOutput('sha', candidate.sha);
            core.info('The required PR workflow input was used only for schema compatibility; no pull request was queried or merged.');
            await core.summary.addRaw(`Validating exact candidate ${candidate.sha}; PR input is schema-only.`).write();

  linux:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          save: false
          evict-old-files: job
      - name: Install lavapipe for the GPU execution tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Run cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
        env:
          CONFIGURE: >-
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - name: Run cmake --build build
        run: cmake --build build
      - name: Run cmake --build build --target libs
        run: cmake --build build --target libs
      - name: Run ctest --test-dir build --output-on-failure --timeout 120 --repeat until-fail:3 --parallel 4 --output-log ctest.log
        run: ctest --test-dir build --output-on-failure --timeout 120 --repeat until-fail:3 --parallel 4 --output-log ctest.log --output-junit ctest.xml
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - name: Check skipped tests
        run: python3 tools/check_skips.py build/ctest.xml
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log