name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 988fa4d6e71433a54be7449895ed6aba011ab547
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANYPS5_REQUIRE_VULKAN: 1
      GALLIUM_OVERRIDE_CPU_CAPS: avx
    steps:
      - name: Require owner dispatch and pin candidate SHA
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY_OWNER" != "ebarr24" || "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "Refusing validation unless the ebarr24 fork owner dispatches this workflow" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CANDIDATE_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          save: false
          evict-old-files: job
      - name: Install lavapipe and Vulkan diagnostics
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Capture raw Vulkan device and subgroup properties
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo 2>&1 | tee vulkaninfo.log
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build
      - run: cmake --build build --target libs
      - run: ctest --test-dir build --output-on-failure --timeout 120 --repeat until-fail:3 --parallel 4 --output-log ctest.log
      - name: Print raw per-test CTest stdout and skip details
        if: always()
        run: |
          if [[ -f build/Testing/Temporary/LastTest.log ]]; then
            sed 's/^/raw-last-test: /' build/Testing/Temporary/LastTest.log
          else
            echo "CTest did not create build/Testing/Temporary/LastTest.log" >&2
          fi
      - name: Print complete CTest log and skip receipts
        if: always()
        run: |
          if [[ -f ctest.log ]]; then
            sed 's/^/raw-ctest: /' ctest.log
          else
            echo "CTest did not create ctest.log" >&2
          fi
