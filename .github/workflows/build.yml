name: Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Required by the fork workflow schema; ignored for checkout and build selection
        required: true
        type: string

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.gate.outputs.base_sha }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          BASE_SHA: a11c8f7f70a0ed4e71504a89de69e8cdae687817
          CANDIDATE_SHA: 47b3f610c31d6d4862bd0553465118beb256e81a
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT)) {
              throw new Error('The required workflow-schema PR input must be a positive integer; it does not select a PR');
            }
            const { owner, repo } = context.repo;
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Only collaborators with write access can start or rerun builds');
              }
            }
            const { data: base } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.BASE_SHA });
            const { data: candidate } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.CANDIDATE_SHA });
            if (base.sha !== process.env.BASE_SHA || candidate.sha !== process.env.CANDIDATE_SHA) {
              throw new Error('A pinned base/candidate commit is unavailable or does not match');
            }
            if (!candidate.parents.some(parent => parent.sha === base.sha)) {
              throw new Error('The exact candidate is not a direct child of the pinned base');
            }
            core.setOutput('base_sha', base.sha);
            core.setOutput('candidate_sha', candidate.sha);
            core.info('The required PR workflow input was used only for schema compatibility; no pull request was queried or merged.');
            await core.summary.addRaw(`Diagnostic-only paired controls: base ${base.sha}; candidate ${candidate.sha}. The PR input is schema-only.`).write();

  paired-linux:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Prepare diagnostic evidence directory
        run: mkdir -p evidence
        timeout-minutes: 2
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        timeout-minutes: 25
        with:
          ref: ${{ needs.eligibility.outputs.base_sha }}
          path: base-source
          persist-credentials: false
          submodules: true
      - uses: actions/checkout@v7
        timeout-minutes: 25
        with:
          ref: ${{ needs.eligibility.outputs.candidate_sha }}
          path: candidate-source
          persist-credentials: false
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        timeout-minutes: 5
        with:
          key: linux-paired-controls
          save: false
          evict-old-files: job
      - name: Install lavapipe and bounded stack diagnostics
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=30s 15m bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools gdb'
      - name: Run matched base and candidate diagnostics
        timeout-minutes: 220
        env:
          BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate_sha }}
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: bash driver/tools/run-paired-controls.sh
      - name: Report per-test skip reasons and validate skips
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          for revision in base candidate; do
            xml="evidence/${revision}/ctest.xml"
            if [ -f "$xml" ]; then
              python3 driver/tools/check_skips.py "$xml" --list || status=1
              python3 driver/tools/check_skips.py "$xml" || status=1
            else
              echo "::error::${revision} CTest JUnit output is missing; skip validation cannot pass"
              status=1
            fi
          done
          exit "$status"
      - name: Upload paired diagnostic evidence
        id: upload
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: paired-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Record exact run and artifact binding
        if: always()
        timeout-minutes: 5
        env:
          DRIVER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate_sha }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          UPLOAD_ARTIFACT_NAME: paired-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'job_id=paired-linux\n'
            printf 'driver_sha=%s\n' "$DRIVER_SHA"
            printf 'base_sha=%s\n' "$BASE_SHA"
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
            printf 'artifact_id=%s\n' "$UPLOAD_ARTIFACT_ID"
            printf 'artifact_name=%s\n' "$UPLOAD_ARTIFACT_NAME"
            printf 'artifact_digest=%s\n' "$UPLOAD_ARTIFACT_DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
