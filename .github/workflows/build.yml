name: Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Required by the fork workflow schema; ignored for checkout and build selection
        required: true
        type: string

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.gate.outputs.base_sha }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          BASE_SHA: 325e0a8bdd44c8f1868f41c7190d9dc5cae0467e
          CANDIDATE_SHA: e5f6ad95a0a65fb416a3d5018d647696256f4f77
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT)) {
              throw new Error('The required workflow-schema PR input must be a positive integer; it does not select a PR');
            }
            const { owner, repo } = context.repo;
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Only collaborators with write access can start or rerun builds');
              }
            }
            const { data: base } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.BASE_SHA });
            const { data: candidate } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.CANDIDATE_SHA });
            if (base.sha !== process.env.BASE_SHA || candidate.sha !== process.env.CANDIDATE_SHA) {
              throw new Error('A pinned base/candidate commit is unavailable or does not match');
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base.sha}...${candidate.sha}`
            });
            if (comparison.status !== 'ahead' || comparison.merge_base_commit?.sha !== base.sha || comparison.ahead_by > 8) {
              throw new Error('The exact candidate is not a bounded descendant of the pinned base');
            }
            core.setOutput('base_sha', base.sha);
            core.setOutput('candidate_sha', candidate.sha);
            core.info('The required PR workflow input was used only for schema compatibility; no pull request was queried or merged.');
            await core.summary.addRaw(`Diagnostic-only paired controls: base ${base.sha}; candidate ${candidate.sha}. The PR input is schema-only.`).write();

  paired-linux:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.base_sha }}
          path: base-source
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.candidate_sha }}
          path: candidate-source
          persist-credentials: false
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-paired-controls
          save: false
          evict-old-files: job
      - name: Record paired diagnostic identities
        run: |
          mkdir -p evidence
          printf 'run_id=%s\nattempt=%s\ndriver_sha=%s\nbase_sha=%s\ncandidate_sha=%s\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.sha }}" \
            "${{ needs.eligibility.outputs.base_sha }}" "${{ needs.eligibility.outputs.candidate_sha }}" \
            > evidence/identity.txt
          uname -a >> evidence/identity.txt
      - name: Install lavapipe for shader execution
        run: timeout --signal=TERM --kill-after=10s 10m sudo apt-get update && timeout --signal=TERM --kill-after=10s 10m sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: Run matched base and candidate diagnostics
        env:
          BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate_sha }}
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: bash driver/tools/run-paired-controls.sh
      - name: Report per-test skip reasons and validate skips
        if: always()
        shell: bash
        run: |
          set -o pipefail
          status=0
          for revision in base candidate; do
            xml="evidence/${revision}/ctest.xml"
            report="evidence/${revision}/skip-report.log"
            mkdir -p "evidence/${revision}"
            if [ -f "$xml" ]; then
              python3 driver/tools/check_skips.py "$xml" --list 2>&1 | tee "$report" || status=1
              python3 driver/tools/check_skips.py "$xml" 2>&1 | tee -a "$report" || status=1
            else
              echo "error: ${revision} CTest JUnit output is missing; skip validation cannot pass" | tee "$report"
              status=1
            fi
          done
          exit "$status"
      - name: Upload paired diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
