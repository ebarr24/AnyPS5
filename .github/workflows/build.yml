name: Private POSIX cancellation probe

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Historical workflow-schema input only; does not select a PR
        required: true
        type: string

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.gate.outputs.base }}
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT) || process.env.PR_SCHEMA_INPUT !== '3391') {
              throw new Error('The required historical 3391 workflow input is schema-only and must not select a PR');
            }
            const { owner, repo } = context.repo;
            if (owner !== 'ebarr24' || repo !== 'AnyPS5' || context.ref !== 'refs/heads/phase-observer-cancel-probe-r2') {
              throw new Error('Dispatch is restricted to the isolated ebarr24/AnyPS5 diagnostic branch');
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!repository.fork || repository.parent?.full_name !== 'boykopovar/AnyPS5') {
              throw new Error('The workflow may run only on the configured AnyPS5 fork');
            }
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Both the actor and triggering actor must have write access');
              }
            }
            const baseSha = '414937718cf0cc1edb2837453adf27b237be5416';
            const candidateSha = '2e59d195b2a388093c5fe4205d8f52abb09771fc';
            for (const sha of [baseSha, candidateSha]) {
              const { data } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              if (data.sha !== sha) throw new Error(`Pinned source commit unavailable: ${sha}`);
            }
            core.setOutput('base', baseSha);
            core.setOutput('candidate', candidateSha);
            core.info('The 3391 input is schema-only; no PR is queried, selected, or merged.');
            await core.summary.addRaw(`Private public-synthetic cancellation probe: base ${baseSha}, candidate ${candidateSha}; no PR selected.`).write();

  linux:
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Prepare durable evidence location
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'run=%s\nattempt=%s\nworkflowEvent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" > evidence/preflight.txt

      - name: Checkout the frozen diagnostic driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout exact base 414
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.base }}
          path: source/base414
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout exact candidate 2e59
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.candidate }}
          path: source/candidate2e59
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Initialize raw evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/base414 evidence/candidate2e59 evidence/cells/base414-trace-off evidence/cells/candidate2e59-trace-off evidence/cells/candidate2e59-trace-on
          driver_head="$(git -C driver rev-parse HEAD)"
          test "$driver_head" = "$GITHUB_SHA"
          printf '%s\n' \
            "driverHead=$driver_head" \
            "workflowSha256=$(sha256sum driver/.github/workflows/build.yml | cut -d' ' -f1)" \
            "run=${GITHUB_RUN_ID}" \
            "attempt=${GITHUB_RUN_ATTEMPT}" \
            'original11CaseRun=38209024552' \
            'original11CaseAttempt=1' \
            'original11CaseJob=114678843899' \
            'original11CaseManifestSha256=3DDAED6E82BA51818C2D828484E42269860810B77674DE5737B54792ABBA131B' \
            'original11CaseGate=preserved failed essential gate; supplemental matrix cannot replace it' \
            > evidence/identity.txt
          sha256sum driver/.github/workflows/build.yml driver/.github/diagnostics/cancel-probe/GuestEventFlag.cpp driver/.github/diagnostics/cancel-probe/CMakeLists.cancel-probe.patch > evidence/driver-files.sha256

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: private-cancel-probe-r2
          save: false
          evict-old-files: job

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libpipewire-0.3-dev libpulse-dev libasound2-dev

      - name: Verify exact source commits and apply the same fixture-only overlay
        shell: bash
        env:
          BASE_SHA: ${{ needs.eligibility.outputs.base }}
          CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate }}
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/driver/.github/diagnostics/cancel-probe/GuestEventFlag.cpp"
          patch_cmake="$GITHUB_WORKSPACE/driver/.github/diagnostics/cancel-probe/CMakeLists.cancel-probe.patch"
          echo '61d3a2dcb6616a130578f44066517b09814cd945d87fc571abb16197ee037ad4  '"$fixture" | sha256sum --check
          echo '3d75c6c3f94480b08c1dcab547da5a84f797154c588077fb8672bcd8ad145331  '"$patch_cmake" | sha256sum --check
          for spec in "base414:$BASE_SHA" "candidate2e59:$CANDIDATE_SHA"; do
            IFS=: read -r name revision <<< "$spec"
            root="$GITHUB_WORKSPACE/source/$name"
            test "$(git -C "$root" rev-parse HEAD)" = "$revision"
            test -z "$(git -C "$root" status --porcelain)"
            if [ "$name" = base414 ]; then
              test "$(git -C "$root" rev-parse HEAD:core/libs/prx/libkernel/CMakeLists.txt)" = 58c5364b04ab1b7a1234a699dc8c1875ac9f8564
              if git -C "$root" cat-file -e HEAD:core/libs/tests/GuestEventFlag.cpp 2>/dev/null; then
                echo 'Unexpected tracked GuestEventFlag.cpp in clean base 414 tree' >&2
                exit 1
              fi
              test ! -e "$root/core/libs/tests/GuestEventFlag.cpp"
            else
              test "$(sha256sum "$root/core/libs/tests/GuestEventFlag.cpp" | cut -d' ' -f1)" = 6ae132600c19650db12b53c1356bc1355790a646fbc59a846ef63be5beb5e20b
              test "$(sha256sum "$root/core/libs/prx/libkernel/CMakeLists.txt" | cut -d' ' -f1)" = dbcb020eb63fbd4bedbc5a6f9aee2db245b84d4a2d55369fdc9f16d5be5c066a
            fi
            git -C "$root" apply --check "$patch_cmake"
            git -C "$root" apply "$patch_cmake"
            cp -- "$fixture" "$root/core/libs/tests/GuestEventFlag.cpp"
            test "$(sha256sum "$root/core/libs/tests/GuestEventFlag.cpp" | cut -d' ' -f1)" = 61d3a2dcb6616a130578f44066517b09814cd945d87fc571abb16197ee037ad4
            changed="$(git -C "$root" status --porcelain | sed 's/^...//' | sort)"
            expected=$'core/libs/prx/libkernel/CMakeLists.txt\ncore/libs/tests/GuestEventFlag.cpp'
            test "$changed" = "$expected"
            git -C "$root" diff --check
            printf '%s\n' "$name revision=$revision" > "$GITHUB_WORKSPACE/evidence/$name/source.txt"
            sha256sum "$root/core/libs/tests/GuestEventFlag.cpp" "$root/core/libs/prx/libkernel/CMakeLists.txt" > "$GITHUB_WORKSPACE/evidence/$name/fixture-files.sha256"
            git -C "$root" rev-parse HEAD^{tree} > "$GITHUB_WORKSPACE/evidence/$name/git-tree-sha.txt"
          done
          cmp source/base414/core/libs/tests/GuestEventFlag.cpp source/candidate2e59/core/libs/tests/GuestEventFlag.cpp

      - name: Record runner and compiler versions
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'runner=%s\n' "$ImageOS $ImageVersion"
            cmake --version
            ninja --version
            gcc --version
            g++ --version
            ccache --version
          } | tee evidence/toolchain.txt

      - name: Configure and build base 414 target only
        shell: bash
        working-directory: source/base414
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -g' '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/base414/configure.log"
          cmake --build build --parallel 2 --target guest_event_flag_cancel_probe_tests 2>&1 | tee "$GITHUB_WORKSPACE/evidence/base414/build.log"
          grep -E '^CMAKE_(BUILD_TYPE|C_FLAGS_RELEASE|CXX_FLAGS_RELEASE):' build/CMakeCache.txt > "$GITHUB_WORKSPACE/evidence/base414/cache-flags.txt"

      - name: Configure and build candidate 2e59 target only
        shell: bash
        working-directory: source/candidate2e59
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -g' '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -g' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/candidate2e59/configure.log"
          cmake --build build --parallel 2 --target guest_event_flag_cancel_probe_tests 2>&1 | tee "$GITHUB_WORKSPACE/evidence/candidate2e59/build.log"
          grep -E '^CMAKE_(BUILD_TYPE|C_FLAGS_RELEASE|CXX_FLAGS_RELEASE):' build/CMakeCache.txt > "$GITHUB_WORKSPACE/evidence/candidate2e59/cache-flags.txt"

      - name: Run all three natural cells once, serially
        shell: bash
        run: |
          set -u
          run_cell() {
            local id="$1" root="$2" case_name="$3"
            local out="$GITHUB_WORKSPACE/evidence/cells/$id"
            mkdir -p "$out"
            local revision tree_sha recorded_clean_windows_fingerprint
            revision="$(git -C "$GITHUB_WORKSPACE/source/$root" rev-parse HEAD)"
            tree_sha="$(git -C "$GITHUB_WORKSPACE/source/$root" rev-parse 'HEAD^{tree}')"
            recorded_clean_windows_fingerprint=not-provided
            if [ "$root" = candidate2e59 ]; then recorded_clean_windows_fingerprint=173ec13f53154d3bec23bee5f1843db7e9b18006dcd90830262e0b8943e3bfeb; fi
            set +e
            ctest --test-dir "$GITHUB_WORKSPACE/source/$root/build" --output-on-failure --verbose --timeout 20 --parallel 1 -R "^${case_name}$" --output-log "$out/ctest.log" --output-junit "$out/ctest.xml" > "$out/console.log" 2>&1
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/ctest.exitcode"
            local result_line
            result_line="$(grep -E 'Test +#[0-9]+: ' "$out/console.log" | tail -n 1 || true)"
            local outcome=unknown
            local signal_name=not-reported
            case "$result_line" in
              *Passed*) outcome=passed ;;
              *'***Timeout'*) outcome=timeout ;;
              *SegFault*) outcome=signal; signal_name=SIGSEGV ;;
              *'Bus Error'*) outcome=signal; signal_name=SIGBUS ;;
              *Illegal*) outcome=signal; signal_name=SIGILL ;;
              *'Subprocess aborted'*) outcome=signal; signal_name=SIGABRT ;;
              *'***Exception:'*) outcome=signal-or-exception ;;
              *'***Failed'*) outcome=failed ;;
              *'***Not'*) outcome=not-run ;;
            esac
            printf '%s\n' "$outcome" > "$out/outcome.txt"
            printf '%s\n' "$signal_name" > "$out/signal-name.txt"
            printf '%s\n' "$result_line" > "$out/result-line.txt"
            printf 'cell=%s\nsource=%s\nsourceSha=%s\ngitTreeSha=%s\nrecordedCleanWindowsSourceFingerprint=%s\ncase=%s\nctestExitCode=%s\ntimeoutSeconds=20\nrepeat=none\nparallel=1\n' "$id" "$root" "$revision" "$tree_sha" "$recorded_clean_windows_fingerprint" "$case_name" "$status" > "$out/cell.txt"
            printf 'fingerprintScope=recorded clean Windows candidate source context; not computed for the Linux diagnostic overlay tree\n' >> "$out/cell.txt"
            printf 'outcome=%s\nresultLine=%s\n' "$outcome" "$result_line" >> "$out/cell.txt"
            printf 'signalName=%s\n' "$signal_name" >> "$out/cell.txt"
            cp "$GITHUB_WORKSPACE/evidence/toolchain.txt" "$out/toolchain.txt"
            local stderr_path="$GITHUB_WORKSPACE/source/$root/build/core/libs/prx/libkernel/${case_name}.stderr"
            if [ -f "$stderr_path" ] && [ ! -L "$stderr_path" ]; then
              cp -- "$stderr_path" "$out/named.stderr"
              stat --printf='stderrBytes=%s\n' "$stderr_path" >> "$out/cell.txt"
              sha256sum "$stderr_path" > "$out/named.stderr.sha256"
            else
              printf '%s\n' "stderrCaptureMissingOrNotRegular=$stderr_path" >> "$out/cell.txt"
            fi
            return 0
          }
          run_cell base414-trace-off base414 guest_event_flag_posix_cancel_probe_off
          run_cell candidate2e59-trace-off candidate2e59 guest_event_flag_posix_cancel_probe_off
          run_cell candidate2e59-trace-on candidate2e59 guest_event_flag_posix_cancel_probe_on

      - name: Enforce exact three-cell accounting and retain failure status
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path('evidence/cells')
          expected = {
              'base414-trace-off': 'guest_event_flag_posix_cancel_probe_off',
              'candidate2e59-trace-off': 'guest_event_flag_posix_cancel_probe_off',
              'candidate2e59-trace-on': 'guest_event_flag_posix_cancel_probe_on',
          }
          problems = []
          actual = sorted(p.name for p in root.iterdir() if p.is_dir()) if root.exists() else []
          if actual != sorted(expected): problems.append(f'cell IDs differ: {actual!r}')
          summary = {'expectedCells': expected, 'actualCellIds': actual, 'results': [], 'problems': problems}
          for cell, test_name in expected.items():
              out = root / cell
              record = {'id': cell, 'test': test_name}
              try:
                  status_text = (out / 'ctest.exitcode').read_text().strip()
                  record['ctestExitCode'] = int(status_text)
                  if record['ctestExitCode'] != 0: problems.append(f'{cell}: CTest exit {status_text}')
                  outcome = (out / 'outcome.txt').read_text().strip()
                  result_line = (out / 'result-line.txt').read_text().strip()
                  signal_name = (out / 'signal-name.txt').read_text().strip()
                  record['outcome'] = outcome
                  record['resultLine'] = result_line
                  record['signalName'] = signal_name
                  if outcome != 'passed': problems.append(f'{cell}: outcome {outcome!r}')
                  xml_path = out / 'ctest.xml'
                  tree = ET.parse(xml_path)
                  cases = tree.findall('.//testcase')
                  names = [case.attrib.get('name') for case in cases]
                  if names != [test_name]: problems.append(f'{cell}: testcases {names!r}')
                  for case in cases:
                      if any(child.tag in ('failure', 'error', 'skipped') for child in case):
                          problems.append(f'{cell}: failed or skipped testcase')
                  stderr = out / 'named.stderr'
                  if not stderr.is_file() or stderr.is_symlink(): problems.append(f'{cell}: named stderr is missing or non-regular')
                  record['stderrBytes'] = stderr.stat().st_size if stderr.is_file() else None
                  record['stderrSha256'] = __import__('hashlib').sha256(stderr.read_bytes()).hexdigest() if stderr.is_file() else None
              except Exception as exc:
                  problems.append(f'{cell}: evidence incomplete: {exc}')
              summary['results'].append(record)
          summary['problems'] = problems
          pathlib.Path('evidence/matrix-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          sys.exit(1 if problems else 0)
          PY

      - name: At most one bounded symbolized reproduction after natural cells
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/gdb-target.json"
          import json, pathlib, subprocess, xml.etree.ElementTree as ET
          cells = [
              ('base414-trace-off', 'base414', 'guest_event_flag_posix_cancel_probe_off'),
              ('candidate2e59-trace-off', 'candidate2e59', 'guest_event_flag_posix_cancel_probe_off'),
              ('candidate2e59-trace-on', 'candidate2e59', 'guest_event_flag_posix_cancel_probe_on'),
          ]
          expected_ids = {cell for cell, _, _ in cells}
          cells_root = pathlib.Path('evidence/cells')
          observed_ids = {p.name for p in cells_root.iterdir() if p.is_dir()} if cells_root.is_dir() else set()
          if observed_ids != expected_ids:
              print(json.dumps({'skip': f'exact natural cell directory set required; expected {sorted(expected_ids)}, found {sorted(observed_ids)}'}))
              raise SystemExit(0)
          valid_outcomes = {'passed', 'failed', 'signal', 'signal-or-exception', 'timeout'}
          problems = []
          for cell, _, test in cells:
              out = cells_root / cell
              required = {
                  'exit': out / 'ctest.exitcode', 'xml': out / 'ctest.xml',
                  'console': out / 'console.log', 'ctestLog': out / 'ctest.log',
                  'outcome': out / 'outcome.txt', 'resultLine': out / 'result-line.txt',
                  'signal': out / 'signal-name.txt'
              }
              missing = [name for name, path in required.items()
                         if not path.is_file() or path.is_symlink()]
              if missing:
                  problems.append(f'{cell}: missing or non-regular required records {missing}')
                  continue
              try:
                  exit_code = int(required['exit'].read_text().strip())
                  outcome = required['outcome'].read_text().strip()
                  result_line = required['resultLine'].read_text().strip()
                  signal_name = required['signal'].read_text().strip()
                  if not required['console'].stat().st_size or not required['ctestLog'].stat().st_size:
                      raise ValueError('console.log or ctest.log is empty')
                  if not result_line or not signal_name:
                      raise ValueError('result-line.txt or signal-name.txt is empty')
                  if signal_name not in {'not-reported', 'SIGSEGV', 'SIGBUS', 'SIGILL', 'SIGABRT'}:
                      raise ValueError(f'unrecognized signal-name record: {signal_name!r}')
                  if outcome == 'signal' and signal_name == 'not-reported':
                      raise ValueError('signal outcome has no recorded signal name')
                  if outcome != 'signal' and signal_name != 'not-reported':
                      raise ValueError(f'{outcome} outcome conflicts with signal-name record {signal_name!r}')
                  if outcome not in valid_outcomes:
                      raise ValueError(f'not a completed natural result: {outcome!r}')
                  if outcome == 'passed':
                      if exit_code != 0 or 'Passed' not in result_line:
                          raise ValueError('passed outcome conflicts with CTest exit/result line')
                  else:
                      if exit_code == 0:
                          raise ValueError(f'{outcome} outcome has zero CTest exit')
                      expected_marker = {
                          'failed': '***Failed', 'signal': None,
                          'signal-or-exception': '***Exception:', 'timeout': '***Timeout'
                      }[outcome]
                      if expected_marker and expected_marker not in result_line:
                          raise ValueError(f'{outcome} outcome conflicts with CTest result line')
                      if outcome == 'signal' and not any(token in result_line for token in
                              ('SegFault', 'Bus Error', 'Illegal', 'Subprocess aborted')):
                          raise ValueError('signal outcome lacks a recognized signal/abort result line')
                  xml_root = ET.parse(required['xml']).getroot()
                  testcase_names = [node.get('name') for node in xml_root.iter('testcase')]
                  matching = [node for node in xml_root.iter('testcase') if node.get('name') == test]
                  if testcase_names != [test] or len(matching) != 1:
                      raise ValueError(f'expected the full XML testcase list to be exactly [{test!r}], found {testcase_names!r}')
                  case = matching[0]
                  if case.get('status', '').lower() in {'notrun', 'not-run', 'not_run'}:
                      raise ValueError('XML testcase is marked not-run')
                  children = [node.tag.rsplit('}', 1)[-1] for node in list(case)]
                  if 'skipped' in children:
                      raise ValueError('XML testcase is skipped')
                  has_failure = any(tag in children for tag in ('failure', 'error'))
                  if outcome == 'passed' and has_failure:
                      raise ValueError('passed outcome conflicts with XML failure/error')
                  if outcome != 'passed' and not has_failure:
                      raise ValueError(f'{outcome} outcome lacks XML failure/error evidence')
              except Exception as exc:
                  problems.append(f'{cell}: incomplete or inconsistent natural result: {exc}')
          if problems:
              print(json.dumps({'skip': 'natural matrix incomplete or malformed; no GDB reproduction: ' + '; '.join(problems)}))
              raise SystemExit(0)
          for cell, source, test in cells:
              out = cells_root / cell
              code = out / 'ctest.exitcode'
              if code.read_text().strip() == '0':
                  continue
              logs = [out / 'console.log', out / 'ctest.log', out / 'named.stderr']
              joined = '\n'.join(p.read_text(errors='replace') for p in logs if p.is_file())
              if any(line.lstrip().startswith(('#0 ', '#1 ', '#2 ', 'Backtrace:')) for line in joined.splitlines()):
                  print(json.dumps({'skip': f'{cell} already has stack-like output'})); break
              ctest = subprocess.run(['ctest', '--test-dir', f'source/{source}/build', '--show-only=json-v1'],
                                     text=True, capture_output=True, check=True)
              matches = [entry for entry in json.loads(ctest.stdout)['tests'] if entry.get('name') == test]
              if len(matches) != 1 or not matches[0].get('command'):
                  print(json.dumps({'skip': f'cannot resolve one exact CTest command for {cell}'})); break
              entry = matches[0]
              props = {item['name']: item['value'] for item in entry.get('properties', [])}
              workdir, environment = props.get('WORKING_DIRECTORY'), props.get('ENVIRONMENT', [])
              workdir_source = 'WORKING_DIRECTORY property in CTest JSON'
              if not workdir:
                  # CTest defaults the test cwd to the binary directory of the CMakeLists
                  # file that registered it. Resolve that directory from this test's JSON backtrace.
                  graph = json.loads(ctest.stdout).get('backtraceGraph', {})
                  nodes, files = graph.get('nodes', []), graph.get('files', [])
                  source_root = pathlib.Path('source') / source
                  index, candidates, seen = entry.get('backtrace'), [], set()
                  while isinstance(index, int) and 0 <= index < len(nodes) and index not in seen:
                      seen.add(index); node = nodes[index]
                      file_index = node.get('file')
                      if isinstance(file_index, int) and 0 <= file_index < len(files):
                          source_file = pathlib.Path(files[file_index])
                          if not source_file.is_absolute(): source_file = source_root / source_file
                          if source_file.name == 'CMakeLists.txt': candidates.append(source_file)
                      index = node.get('parent')
                  matching = set()
                  for candidate in candidates:
                      try: matching.add(candidate.resolve().relative_to(source_root.resolve()).parent)
                      except ValueError: pass
                  if len(matching) == 1:
                      workdir = str((source_root / 'build' / next(iter(matching))).resolve())
                      workdir_source = 'CTest JSON backtraceGraph registration directory plus documented CTest default binary-directory rule'
              if not isinstance(workdir, str) or not workdir:
                  print(json.dumps({'skip': f'cannot resolve exact CTest working directory from JSON for {cell}'})); break
              if isinstance(environment, str): environment = [environment]
              if not isinstance(environment, list) or not all(isinstance(item, str) and '=' in item for item in environment):
                  print(json.dumps({'skip': f'CTest JSON ENVIRONMENT is not a supported VAR=value list for {cell}'})); break
              env_mods = props.get('ENVIRONMENT_MODIFICATION', [])
              if env_mods:
                  print(json.dumps({'skip': f'CTest JSON has ENVIRONMENT_MODIFICATION; exact replay unsupported for {cell}'})); break
              print(json.dumps({
                  'cell': cell, 'source': source, 'test': test, 'command': entry['command'],
