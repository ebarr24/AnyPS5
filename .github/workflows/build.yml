name: Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Existing upstream PR under review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify fork validation authorization
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.repo.owner !== 'ebarr24' || context.repo.repo !== 'AnyPS5') {
              throw new Error('This validation driver is restricted to manual runs on the author fork');
            }
            for (const username of new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Only collaborators with write access can start or rerun validation');
              }
            }
      - uses: actions/checkout@v7
        with:
          ref: bba53098427f22c0fc2905a616fd3305f0bb5a49
          persist-credentials: false
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: Install lavapipe for the GPU execution tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build
      - run: cmake --build build --target libs
      - run: ctest --test-dir build --output-on-failure --timeout 120 --repeat until-fail:3
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx

