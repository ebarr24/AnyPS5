name: Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Historical workflow-schema input only; does not select a PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: host-personality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.gate.outputs.base }}
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          PR_SCHEMA_INPUT: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_SCHEMA_INPUT) || process.env.PR_SCHEMA_INPUT !== '3391') {
              throw new Error('The required historical 3391 workflow input is schema-only and must not select a PR');
            }
            const { owner, repo } = context.repo;
            if (owner !== 'ebarr24' || repo !== 'AnyPS5' || context.ref !== 'refs/heads/phase-observer-host-personality-9aa') {
              throw new Error('Dispatch is restricted to the isolated ebarr24/AnyPS5 diagnostic branch');
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!repository.fork || repository.parent?.full_name !== 'boykopovar/AnyPS5') {
              throw new Error('The workflow may run only on the configured AnyPS5 fork');
            }
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error('Both the actor and triggering actor must have write access');
              }
            }
            const baseSha = '9aa5fd290007d816bfed6970ee259f9baaa0e24e';
            const candidateSha = '824cad55faa8d43dc461ae786da62e76d383aff4';
            for (const sha of [baseSha, candidateSha]) {
              const { data } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              if (data.sha !== sha) throw new Error(`Pinned source commit unavailable: ${sha}`);
            }
            core.setOutput('base', baseSha);
            core.setOutput('candidate', candidateSha);
            core.info('The 3391 input is schema-only; no PR is queried, selected, or merged.');
            await core.summary.addRaw(`Linux host forced-unwind regression: base ${baseSha}, candidate ${candidateSha}; no PR selected.`).write();

  linux:
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout frozen diagnostic driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout exact selected base 9aa
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.base }}
          path: source/base
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.eligibility.outputs.candidate }}
          path: source/head
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Prepare durable evidence location
        run: |
          set -euo pipefail
          mkdir -p evidence/base evidence/head evidence/identity
          driver_head="$(git -C driver rev-parse HEAD)"
          test "$driver_head" = "$GITHUB_SHA"
          printf 'run=%s\nattempt=%s\nworkflowEvent=%s\ndriverHead=%s\nbase=%s\ncandidate=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$driver_head" \
            '${{ needs.eligibility.outputs.base }}' '${{ needs.eligibility.outputs.candidate }}' > evidence/identity/run.txt
          sha256sum driver/.github/workflows/build.yml > evidence/identity/driver-workflow.sha256
          test "$(git -C source/base rev-parse HEAD)" = '${{ needs.eligibility.outputs.base }}'
          test "$(git -C source/head rev-parse HEAD)" = '${{ needs.eligibility.outputs.candidate }}'
          test -z "$(git -C source/base status --porcelain)"
          test -z "$(git -C source/head status --porcelain)"

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: host-forced-personality-9aa
          save: false
          evict-old-files: job

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev

      - name: Record exact candidate checkout
        working-directory: source/head
        run: git log -1 --format=%H

      - name: Apply identical test-only overlay to base
        env:
          BASE_SHA: ${{ needs.eligibility.outputs.base }}
          CANDIDATE_SHA: ${{ needs.eligibility.outputs.candidate }}
        run: |
          set -euo pipefail
          test ! -e source/base/core/libs/tests/GuestHostCancellation.cpp
          cp source/head/core/libs/tests/GuestHostCancellation.cpp source/base/core/libs/tests/GuestHostCancellation.cpp
          git -C source/head diff --no-ext-diff "$BASE_SHA" "$CANDIDATE_SHA" -- core/libs/prx/libkernel/CMakeLists.txt > evidence/base/libkernel-test-registration.patch
          test -s evidence/base/libkernel-test-registration.patch
          git -C source/base apply --check "$GITHUB_WORKSPACE/evidence/base/libkernel-test-registration.patch"
          git -C source/base apply "$GITHUB_WORKSPACE/evidence/base/libkernel-test-registration.patch"
          test "$(sha256sum source/base/core/libs/tests/GuestHostCancellation.cpp | cut -d' ' -f1)" = "$(sha256sum source/head/core/libs/tests/GuestHostCancellation.cpp | cut -d' ' -f1)"
          test "$(git -C source/base status --porcelain | wc -l)" -eq 2
          sha256sum source/base/core/libs/tests/GuestHostCancellation.cpp source/head/core/libs/tests/GuestHostCancellation.cpp source/base/core/libs/prx/libkernel/CMakeLists.txt source/head/core/libs/prx/libkernel/CMakeLists.txt evidence/base/libkernel-test-registration.patch > evidence/base/overlay.sha256
          git -C source/base status --short > evidence/base/overlay-status.txt

      - name: Configure exact base focused regression
        working-directory: source/base
        run: |
          set -euo pipefail
          cmake -S . -B build $CONFIGURE > ../../evidence/base/configure.log 2>&1

      - name: Build four essential regression targets on base
        working-directory: source/base
        run: |
          set -euo pipefail
          cmake --build build --target guest_host_cancellation_tests exception_runtime_tests exception_personality_tests exception_c_cleanup_tests --parallel 2 > ../../evidence/base/build.log 2>&1

      - name: Run four essential regression cases on base and require intended cancellation failure
        working-directory: source/base
        run: |
          set -euo pipefail
          set +e
          ctest --test-dir build --output-on-failure --timeout 120 -R '^(guest_host_cancellation|exception_runtime|exception_personality|exception_c_cleanup)$' --output-log "$GITHUB_WORKSPACE/evidence/base/ctest.log" --output-junit "$GITHUB_WORKSPACE/evidence/base/ctest.xml" > "$GITHUB_WORKSPACE/evidence/base/console.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/evidence/base/ctest.exitcode"
          test "$result" -ne 0
          grep -q 'guest_host_cancellation' "$GITHUB_WORKSPACE/evidence/base/ctest.log"
          grep -Eq 'SegFault|SIGSEGV' "$GITHUB_WORKSPACE/evidence/base/ctest.log"
          python3 - "$GITHUB_WORKSPACE/evidence/base/ctest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = [node for node in root.iter('testcase')]
          expected = {'guest_host_cancellation', 'exception_runtime', 'exception_personality', 'exception_c_cleanup'}
          names = [case.get('name') for case in cases]
          if set(names) != expected or len(names) != len(expected):
              raise SystemExit(f'base focused result set mismatch: {names!r}')
          by_name = {case.get('name'): case for case in cases}
          for name in expected - {'guest_host_cancellation'}:
              if any(child.tag.rsplit('}', 1)[-1] in {'failure', 'error', 'skipped'} for child in by_name[name]):
                  raise SystemExit(f'base control case did not pass: {name}')
          failing = by_name['guest_host_cancellation']
          if not any(child.tag.rsplit('}', 1)[-1] in {'failure', 'error'} for child in failing):
              raise SystemExit('base cancellation case lacks a failure record')
          if any(child.tag.rsplit('}', 1)[-1] == 'skipped' for case in cases for child in case):
              raise SystemExit('base focused matrix contains a skipped case')
          PY

      - name: Run cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
        working-directory: source/head
        run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON

      - name: Build four essential regression targets on candidate
        working-directory: source/head
        run: |
          set -euo pipefail
          cmake --build build --target guest_host_cancellation_tests exception_runtime_tests exception_personality_tests exception_c_cleanup_tests --parallel 2 > "$GITHUB_WORKSPACE/evidence/head/focused-build.log" 2>&1

      - name: Run four essential regression cases on candidate
        working-directory: source/head
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --timeout 120 -R '^(guest_host_cancellation|exception_runtime|exception_personality|exception_c_cleanup)$' --output-log "$GITHUB_WORKSPACE/evidence/head/ctest.log" --output-junit "$GITHUB_WORKSPACE/evidence/head/ctest.xml" > "$GITHUB_WORKSPACE/evidence/head/console.log" 2>&1
          python3 - "$GITHUB_WORKSPACE/evidence/head/ctest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = [node for node in root.iter('testcase')]
          expected = {'guest_host_cancellation', 'exception_runtime', 'exception_personality', 'exception_c_cleanup'}
          names = [case.get('name') for case in cases]
          if set(names) != expected or len(names) != len(expected):
              raise SystemExit(f'candidate focused result set mismatch: {names!r}')
          for case in cases:
              if any(child.tag.rsplit('}', 1)[-1] in {'failure', 'error', 'skipped'} for child in case):
                  raise SystemExit(f'candidate focused case did not pass: {case.get("name")}')
          PY

      - name: Check that every test executable is registered with ctest
        working-directory: source/head
        run: python3 tools/check_test_registration.py build

      - name: Run cmake --build build
        working-directory: source/head
        run: cmake --build build --parallel 2

      - name: Run cmake --build build --target libs
        working-directory: source/head
        run: cmake --build build --target libs --parallel 2

      - name: Run ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log
        working-directory: source/head
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --repeat until-fail:3 --output-log ctest.log --output-junit ctest.xml

      - name: Check Linux CTest skips
        if: ${{ !cancelled() }}
        working-directory: source/head
        run: python3 tools/check_skips.py build/ctest.xml

      - name: Verify essential Linux regressions passed three times
        if: ${{ !cancelled() }}
        working-directory: source/head
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          essential = {'guest_host_cancellation', 'exception_runtime', 'exception_personality', 'exception_c_cleanup'}
          root = ET.parse('build/ctest.xml').getroot()
          cases = [case for case in root.iter('testcase')]
          by_name = {case.get('name'): case for case in cases}
          if not essential.issubset(by_name):
              raise SystemExit(f'missing essential Linux cases: {sorted(essential - set(by_name))}')
          for name in essential:
              case = by_name[name]
              if any(child.tag.rsplit('}', 1)[-1] in {'failure', 'error', 'skipped'} for child in case):
                  raise SystemExit(f'essential Linux case not passed: {name}')
          log = pathlib.Path('build/ctest.log').read_text(errors='replace')
          for name in essential:
              runs = re.findall(rf'^\d+/3 Test\s+#\d+: {re.escape(name)}\s+\.\.\.\s+Passed\b', log, re.MULTILINE)
              if len(runs) != 3:
                  raise SystemExit(f'{name} passed {len(runs)} times, expected three')
          PY

      - name: Upload focused and full Linux evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: host-forced-personality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/**
            source/base/build/Testing/Temporary/LastTest.log
            source/head/build/Testing/Temporary/LastTest.log
            source/head/build/ctest.log
            source/head/build/ctest.xml
          if-no-files-found: error
          retention-days: 7
